<!DOCTYPE html>
<html>
<head>
    <title>Blood Donation Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Blood Donation Registration</h2>

<form id="donorForm">

    <label>Donor ID</label>
    <input type="text" id="donorId" required>

    <label>Donor Name</label>
    <input type="text" id="name" required>

    <label>Age</label>
    <input type="number" id="age" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Phone Number</label>
    <input type="text" id="phone" required>

    <label>Blood Group</label>
    <select id="blood" required>
        <option value="">Select</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>
    </select>

    <label>Gender</label>
    <select id="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <label>Donation Date</label>
    <input type="date" id="date" required>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

<hr>

<h3>Search Donor</h3>

<input type="text" id="searchId" placeholder="Enter Donor ID">
<button onclick="searchDonor()">Search</button>

<p id="result"></p>

<h3>Delete Donor</h3>

<input type="text" id="deleteId" placeholder="Enter Donor ID">
<button onclick="deleteDonor()">Delete</button>

<script src="script.js"></script>

</body>
</html>
